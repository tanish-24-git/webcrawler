[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webcrawler"
version = "0.1.0"
description = "High-throughput asynchronous web crawler with a terminal UI and CSV output."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "tanish-24-git" }]
keywords = ["crawler", "spider", "scraper", "async", "aiohttp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "aiohttp>=3.9",
    "aiodns>=3.1; sys_platform != 'win32'",
    "selectolax>=0.3.21",
    "tldextract>=5.1",
    "rich>=13.7",
    "typer>=0.12",
    "platformdirs>=4.2",
    "pybloom-live>=4.0",
    "yarl>=1.9",
]

[project.optional-dependencies]
uvloop = ["uvloop>=0.19; sys_platform != 'win32'"]
redis = ["redis>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
webcrawler = "webcrawler.cli:app"

[project.urls]
Homepage = "https://github.com/tanish-24-git/webcrawler"
Documentation = "https://github.com/tanish-24-git/webcrawler/tree/main/docs"
Source = "https://github.com/tanish-24-git/webcrawler"
Issues = "https://github.com/tanish-24-git/webcrawler/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webcrawler = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
